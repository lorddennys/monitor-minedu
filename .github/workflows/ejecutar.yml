name: Monitor MINEDU

on:
  schedule:
    - cron: '0 11,18,1 * * *' # 6:00 a.m., 1:00 p.m. y 8:00 p.m. (hora Perú)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script
        run: python monitor.py

      - name: Guardar novedades detectadas
        run: |
          git config --global user.name "Monitor MINEDU Bot"
          git config --global user.email "actions@github.com"
          git add normas_conocidas.json
          git diff --staged --quiet || (git commit -m "Nueva norma legal MINEDU detectada" && git push)
